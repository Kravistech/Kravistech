<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kravis Technologies - Certificate</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: rgb(239, 243, 247);
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .certificate-container {
      background: #fff;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      max-width: 90%;
      text-align: center;
    }
    .certificate-container img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .caption {
      margin-top: 15px;
      font-size: 1.2em;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="certificate-container">
    <div><img src="Certificate_KRAVIS.jpg" alt="Kravis Technologies Certificate"></div>
    
    <div class="caption">Certificate – KRAVIS University </div>
  </div>
</body>
</html>
